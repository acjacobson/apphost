name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check shell script syntax
        run: bash -n scripts/*.sh
      - name: Check apphost CLI syntax
        run: python3 -m py_compile scripts/apphost
      - name: Smoke test apphost CLI registry parsing
        run: |
          APPHOST_REGISTRY=apps.example.yml python3 scripts/apphost list | grep -q '^example'
          python3 scripts/apphost --help >/tmp/apphost-help.txt
      - name: Validate shell scripts with ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
      - name: Validate proxy compose
        run: docker compose -f proxy/compose.yml config >/tmp/apphost-proxy.yml
      - name: Check for obvious committed secrets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          patterns = [
              re.compile(r"BEGIN (RSA|OPENSSH|PRIVATE) KEY"),
              re.compile(r"AWS_SECRET_ACCESS_KEY\s*="),
              re.compile(r"GITHUB_TOKEN\s*="),
              re.compile(r"(PASSWORD|SECRET|API_KEY)\s*=\s*[^\s#]+"),
          ]
          excluded_dirs = {".git"}
          hits = []

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue
              if any(part in excluded_dirs for part in path.parts):
                  continue
              if path.as_posix() == ".github/workflows/ci.yml":
                  continue
              try:
                  text = path.read_text(errors="ignore")
              except OSError:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  if any(pattern.search(line) for pattern in patterns):
                      hits.append(f"{path}:{line_no}:{line}")

          if hits:
              print("Potential secret found. Review output below.")
              print("\n".join(hits))
              sys.exit(1)
          PY
